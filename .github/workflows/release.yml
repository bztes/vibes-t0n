name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # npm trusted publishing (OIDC) and provenance, no NPM_TOKEN needed.
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Also builds dist/ through the prepare script.
      - run: pnpm install --frozen-lockfile

      # With pending changesets: opens/updates the "chore: release" PR.
      # Once that is merged: publishes every version not yet on npm, tags it and creates a GitHub release.
      - uses: changesets/action@v2
        with:
          version: pnpm changeset version
          publish: pnpm changeset publish
          commit: 'chore: release'
          title: 'chore: release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
